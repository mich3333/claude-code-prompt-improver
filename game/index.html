<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voxel Sandbox</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="crosshair"></div>
    <div id="hotbar"></div>
    <div id="debug"></div>
    <div id="overlay">
      <div class="panel">
        <h1>Voxel Sandbox</h1>
        <p class="start">Click to play</p>
        <ul>
          <li><b>WASD</b> move &middot; <b>Space</b> jump &middot; <b>Shift</b> sprint</li>
          <li><b>Mouse</b> look</li>
          <li><b>Left click</b> break &middot; <b>Right click</b> place</li>
          <li><b>1&ndash;6</b> / <b>wheel</b> select block</li>
          <li><b>Esc</b> release mouse</li>
        </ul>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
